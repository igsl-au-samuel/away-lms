name: Claude Review

# Posts a Claude review comment on every PR opened from this repo. Same auth as
# claude.yml (subscription token secret, no paid API key). Fork PRs are skipped:
# they cannot read secrets, and the repo is public.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Check it against the linked issue's acceptance
            criteria, correctness and security (this repo is public: flag any committed
            secret, and any authorization logic outside Postgres RLS/RPCs), tests
            (every RLS policy needs pgTAP tests), and the rules in CLAUDE.md. Be
            concise: lead with blocking issues, then minor ones; say so if there are none.
            Post one summary comment with `gh pr comment`.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
