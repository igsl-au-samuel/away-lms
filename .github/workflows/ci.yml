name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    env:
      # Placeholders (local-stack defaults, not secrets). NEXT_PUBLIC_* values are
      # inlined at build time once the Supabase clients land (T054).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:worker
      - name: Check the client bundle for secrets
        run: node scripts/check-client-bundle.mjs

  # Both jobs below run against a real local Supabase stack. The keys are
  # throwaway local-stack values read from `supabase status`; the password is
  # generated per run and never stored.
  #
  # Two things print them into the log. `supabase start` shows its own status
  # box, which is generated during the step, so nothing can be masked before it
  # exists — that one is redacted as it is written. `::add-mask::` then covers
  # everything exported to $GITHUB_ENV, because each later step echoes its whole
  # `env:` block in clear text at the top of its log group.
  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the local stack (bounded retry, #429)
        run: |
          set -o pipefail
          # `supabase start` stops the container it just started and re-binds the host
          # port before the kernel has finished releasing it, so the bind loses and the
          # job goes red before a test runs. Three attempts, then stop: a job that
          # fails three times is a different class and must be read, not re-run.
          # Each failure prints what holds the port first — a leftover container and an
          # ephemeral socket look the same in the error but need different fixes.
          for attempt in 1 2 3; do
            if supabase start 2>&1 | sed -E 's/sb_secret_[A-Za-z0-9_-]+/[redacted]/g'; then
              if [ "$attempt" -gt 1 ]; then
                echo "::notice::supabase start passed on attempt $attempt of 3 — the #429 bind race, retried"
              fi
              exit 0
            fi
            echo "supabase start failed (attempt $attempt of 3). Holder of 55320-55329:"
            sysctl -n net.ipv4.ip_local_port_range 2>/dev/null || echo "  ip_local_port_range: unavailable"
            sysctl -n net.ipv4.ip_local_reserved_ports 2>/dev/null || echo "  ip_local_reserved_ports: unset"
            ss -tanp '( sport = :55320 or sport = :55321 or sport = :55322 or sport = :55323 or sport = :55324 or sport = :55329 )' || true
            docker ps -a --filter name=supabase_ --format '  container: {{.Names}} | {{.Status}} | {{.Ports}}' || true
            docker ps -aq --filter name=supabase_ | xargs -r docker rm -f || true
            sleep 5
          done
          echo "::error::supabase start failed on all 3 attempts. This is not the #429 bind race — read the diagnostics above."
          exit 1
      - name: Export local stack env and seed users
        run: |
          eval "$(supabase status -o env)"
          E2E_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$E2E_PASSWORD"
          echo "::add-mask::$SECRET_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "E2E_PASSWORD=$E2E_PASSWORD"
          } >> "$GITHUB_ENV"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="$SECRET_KEY"             npm run seed:local -- --password "$E2E_PASSWORD"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: npm ci
      - name: Start the local stack (bounded retry, #429)
        run: |
          set -o pipefail
          # `supabase start` stops the container it just started and re-binds the host
          # port before the kernel has finished releasing it, so the bind loses and the
          # job goes red before a test runs. Three attempts, then stop: a job that
          # fails three times is a different class and must be read, not re-run.
          # Each failure prints what holds the port first — a leftover container and an
          # ephemeral socket look the same in the error but need different fixes.
          for attempt in 1 2 3; do
            if supabase start 2>&1 | sed -E 's/sb_secret_[A-Za-z0-9_-]+/[redacted]/g'; then
              if [ "$attempt" -gt 1 ]; then
                echo "::notice::supabase start passed on attempt $attempt of 3 — the #429 bind race, retried"
              fi
              exit 0
            fi
            echo "supabase start failed (attempt $attempt of 3). Holder of 55320-55329:"
            sysctl -n net.ipv4.ip_local_port_range 2>/dev/null || echo "  ip_local_port_range: unavailable"
            sysctl -n net.ipv4.ip_local_reserved_ports 2>/dev/null || echo "  ip_local_reserved_ports: unset"
            ss -tanp '( sport = :55320 or sport = :55321 or sport = :55322 or sport = :55323 or sport = :55324 or sport = :55329 )' || true
            docker ps -a --filter name=supabase_ --format '  container: {{.Names}} | {{.Status}} | {{.Ports}}' || true
            docker ps -aq --filter name=supabase_ | xargs -r docker rm -f || true
            sleep 5
          done
          echo "::error::supabase start failed on all 3 attempts. This is not the #429 bind race — read the diagnostics above."
          exit 1
      - name: Export local stack env
        run: |
          eval "$(supabase status -o env)"
          E2E_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$E2E_PASSWORD"
          echo "::add-mask::$SECRET_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "E2E_PASSWORD=$E2E_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: npm run seed:local -- --password "$E2E_PASSWORD"
      - run: npm run test:integration

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start the local stack (bounded retry, #429)
        run: |
          set -o pipefail
          # `supabase start` stops the container it just started and re-binds the host
          # port before the kernel has finished releasing it, so the bind loses and the
          # job goes red before a test runs. Three attempts, then stop: a job that
          # fails three times is a different class and must be read, not re-run.
          # Each failure prints what holds the port first — a leftover container and an
          # ephemeral socket look the same in the error but need different fixes.
          for attempt in 1 2 3; do
            if supabase start 2>&1 | sed -E 's/sb_secret_[A-Za-z0-9_-]+/[redacted]/g'; then
              if [ "$attempt" -gt 1 ]; then
                echo "::notice::supabase start passed on attempt $attempt of 3 — the #429 bind race, retried"
              fi
              exit 0
            fi
            echo "supabase start failed (attempt $attempt of 3). Holder of 55320-55329:"
            sysctl -n net.ipv4.ip_local_port_range 2>/dev/null || echo "  ip_local_port_range: unavailable"
            sysctl -n net.ipv4.ip_local_reserved_ports 2>/dev/null || echo "  ip_local_reserved_ports: unset"
            ss -tanp '( sport = :55320 or sport = :55321 or sport = :55322 or sport = :55323 or sport = :55324 or sport = :55329 )' || true
            docker ps -a --filter name=supabase_ --format '  container: {{.Names}} | {{.Status}} | {{.Ports}}' || true
            docker ps -aq --filter name=supabase_ | xargs -r docker rm -f || true
            sleep 5
          done
          echo "::error::supabase start failed on all 3 attempts. This is not the #429 bind race — read the diagnostics above."
          exit 1
      - run: supabase db lint --fail-on error
      - run: supabase test db
